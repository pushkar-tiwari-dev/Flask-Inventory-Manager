<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/vapor/bootstrap.min.css" rel="stylesheet">
    <title>Register - Smart Inventory Manager</title>
    
    <style>
        body {
            background: linear-gradient(rgba(15, 15, 35, 0.85), rgba(15, 15, 35, 0.85)), 
                        url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: rgba(30, 30, 45, 0.9) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 0;
        }

        .login-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 0; }
        .login-container { width: 100%; max-width: 420px; padding: 15px; }

        .card {
            background-color: rgba(30, 30, 45, 0.75) !important;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
        }

        .brand-logo { font-family: 'Segoe UI', Roboto, sans-serif; font-weight: 800; letter-spacing: 2px; color: #ffffff; }
        .brand-logo span { color: #32fbe2; }

        .form-label { font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 0.75rem; margin-bottom: 0.5rem; }
        .form-control { background-color: rgba(255, 255, 255, 0.03) !important; border: 1px solid rgba(255, 255, 255, 0.15) !important; color: #fff !important; border-radius: 8px; padding: 0.75rem 1rem; }
        .form-control:focus { border-color: #32fbe2 !important; box-shadow: 0 0 0 0.2rem rgba(50, 251, 226, 0.15) !important; }

        .btn-primary { background: linear-gradient(45deg, #32fbe2, #444cf7) !important; border: none !important; font-weight: 700; letter-spacing: 1.5px; padding: 0.8rem; border-radius: 8px; transition: all 0.3s ease; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(50, 251, 226, 0.3); }
        .footer-text { font-size: 0.7rem; color: rgba(255, 255, 255, 0.4); letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark">
        <div class="container justify-content-center">
            <span class="navbar-brand brand-logo m-0"><span>SIM</span> | SMART INVENTORY</span>
        </div>
    </nav>

    <div class="login-wrapper">
        <div class="login-container">
            <div class="text-center mb-4">
                <p class="text-muted small text-uppercase fw-bold mb-0" style="letter-spacing: 2px;">Operator Onboarding</p>
                <div class="badge bg-dark border border-secondary text-info mt-2">REGISTRATION v1.0</div>
            </div>

            <div class="card">
                <div class="card-body p-4 p-md-5">
                    <h4 class="text-center mb-4 fw-light">Create Operator Account</h4>

                    <form method="POST" action="/register">
                        <div class="mb-3">
                            <label for="username" class="form-label text-muted">New Operator ID</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Choose a username" required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label text-muted">New Access Key</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">PROVISION ACCOUNT</button>
                    </form>
                </div>
                
                <div class="card-footer border-0 text-center pb-4">
                    <p class="small text-muted mb-0">Already have credentials? <br>
                        <a href="/login" class="text-info text-decoration-none fw-bold mt-2 d-inline-block">Log In to Console</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
