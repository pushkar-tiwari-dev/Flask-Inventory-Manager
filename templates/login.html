<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/vapor/bootstrap.min.css" rel="stylesheet">
    <title>Login - Inventory Manager</title>
    <style>
        body { background: linear-gradient(rgba(15, 15, 35, 0.92), rgba(15, 15, 35, 0.92)), url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?q=80&w=2070&auto=format&fit=crop'); background-size: cover; background-attachment: fixed; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
        .glass-card { background: rgba(30, 30, 45, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; }
        .form-label { color: #32fbe2; font-weight: 700; text-transform: uppercase; font-size: 0.7rem; }
        .btn-primary { background: linear-gradient(45deg, #32fbe2, #444cf7); border: none; font-weight: 800; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark border-bottom border-info border-opacity-25 py-3">
        <div class="container justify-content-center">
            <span class="navbar-brand fw-bold tracking-widest">SMART <span class="text-info">INVENTORY</span></span>
        </div>
    </nav>
    <div class="container d-flex flex-grow-1 align-items-center justify-content-center">
        <div class="card glass-card p-4" style="width: 100%; max-width: 400px;">
            <h3 class="text-center mb-4 fw-light">Log In</h3>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}{% for category, msg in messages %}
                    <div class="alert alert-{{ category }} py-2 small">{{ msg }}</div>
                {% endfor %}{% endif %}
            {% endwith %}
            <form method="POST" action="/login">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control bg-dark border-secondary text-white" placeholder="Enter username" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control bg-dark border-secondary text-white" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">ENTER DASHBOARD</button>
            </form>
            <div class="text-center mt-4">
                <a href="/register" class="text-info text-decoration-none small">Need an account? Register here</a>
            </div>
        </div>
    </div>
</body>
</html>
