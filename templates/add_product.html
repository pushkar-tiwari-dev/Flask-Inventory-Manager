<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/vapor/bootstrap.min.css" rel="stylesheet">
    <title>Add New Item</title>
    <style>
        body { background: linear-gradient(rgba(15, 15, 35, 0.95), rgba(15, 15, 35, 0.95)), url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?q=80&w=2070&auto=format&fit=crop'); color: #fff; min-height: 100vh; }
        .glass-card { background: rgba(30, 30, 45, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; }
        .form-label { color: #32fbe2; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark border-bottom border-info border-opacity-10 py-3 mb-5">
        <div class="container"><a class="navbar-brand fw-bold" href="/">SIM | ADD ITEM</a><a href="/" class="btn btn-outline-info btn-sm">Back to Dashboard</a></div>
    </nav>
    <div class="container d-flex justify-content-center">
        <div class="card glass-card p-4 p-md-5" style="width: 100%; max-width: 600px;">
            <h3 class="text-center fw-light mb-4">Add Item to Inventory</h3>
            <form method="POST">
                <div class="mb-4">
                    <label class="form-label">Item Name</label>
                    <input type="text" name="name" class="form-control bg-dark border-secondary text-white" placeholder="e.g., Ericsson RRU 4449" required pattern=".*\S.*">
                </div>
                <div class="mb-4">
                    <label class="form-label">Item Description</label>
                    <textarea name="description" class="form-control bg-dark border-secondary text-white" rows="3" placeholder="Enter details like specifications or model number..."></textarea>
                </div>
                <div class="row mb-4">
                    <div class="col-6"><label class="form-label">Quantity</label><input type="number" name="quantity" class="form-control bg-dark border-secondary text-white" required min="1"></div>
                    <div class="col-6"><label class="form-label">Price (₹)</label><input type="number" step="0.01" name="price" class="form-control bg-dark border-secondary text-white" required min="0"></div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold">SAVE TO INVENTORY</button>
            </form>
        </div>
    </div>
</body>
</html>
